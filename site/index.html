<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ptbudget: coming soon</title>
<meta name="description" content="ptbudget is getting ready for launch: a private budget tracker that runs entirely in your browser.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04030c">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --space: #04030c;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.88);
    --text-faint: rgba(255, 255, 255, 0.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--space);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* The sky is fixed and clipped, so the canvas (rounded up to whole pixels) never adds a scrollbar. */
  .sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--space);
  }

  #galaxy {
    position: absolute;
    top: 0;
    left: 0;
    image-rendering: pixelated;
    pointer-events: none;
  }

  /* Soft shade behind the copy so it never fights the galactic core. */
  .shade {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 62% 58% at 50% 50%, rgba(4, 3, 12, 0.66), rgba(4, 3, 12, 0) 78%);
  }

  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 48px 16px 72px;
    text-align: center;
  }

  .logo {
    width: clamp(96px, 28vw, 144px);
    height: auto;
    overflow: visible;
    animation: bob 2.4s steps(4) infinite alternate;
  }

  @keyframes bob {
    from { transform: translateY(-5px); }
    to { transform: translateY(5px); }
  }

  .headline {
    width: min(90vw, 640px);
    height: auto;
    overflow: visible;
  }

  /* A dark halo keeps the copy readable where the galaxy's bright band passes behind it. */
  .copy {
    max-width: 520px;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7), 0 0 6px rgba(4, 3, 12, 0.95), 0 0 18px rgba(4, 3, 12, 0.9);
  }

  .copy p { margin: 0; }

  .lead {
    font-size: clamp(1.15rem, 2.6vw, 1.4rem);
    font-weight: 700;
  }

  .detail {
    margin-top: 10px !important;
    color: var(--text-dim);
  }

  footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    color: var(--text-faint);
    font: 12px/1.4 ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7), 0 0 6px rgba(4, 3, 12, 0.95), 0 0 14px rgba(4, 3, 12, 0.9);
  }

  /* Anchored with top/left: left at its static position it can widen the page. */
  .visually-hidden {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    /* !important outranks the SMIL flap, so the wings hold one frame. */
    .wing-up { visibility: visible !important; }
    .wing-mid, .wing-down { visibility: hidden !important; }
  }
</style>
</head>

<script>
// Pixel-art Milky Way, the same seeded generator the app's 404 page uses
// (src/lib/pixelGalaxy.ts on devel/latest), ported to plain JavaScript.
(() => {
  const canvas = document.getElementById('galaxy');
  const context = canvas && canvas.getContext('2d');
  if (!context) return;

  const MIN_PIXEL_SIZE = 4;
  const MAX_GALAXY_WIDTH = 480;
  const FRAME_INTERVAL_MS = 90;
  const RESIZE_DEBOUNCE_MS = 150;
  const SHOOTING_STAR_LIFE_S = 0.9;
  const SHOOTING_STAR_TRAIL = 7;
  const INTENSITY_LEVELS = 11;
  const MAX_INTENSITY = 0.82;
  const HUE_LEVELS = 4;

  const hex = (value) => {
    const n = parseInt(value.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const WARM_RAMP = [
    [0, hex('#04030c')], [0.14, hex('#0b0a2a')], [0.28, hex('#1d1457')], [0.42, hex('#4a2090')],
    [0.56, hex('#8e3a9e')], [0.7, hex('#d4627f')], [0.84, hex('#ffb571')], [1, hex('#fff1d2')],
  ];
  const COOL_RAMP = [
    [0, hex('#04030c')], [0.14, hex('#07112c')], [0.28, hex('#0f2a5e')], [0.42, hex('#1a4fa0')],
    [0.56, hex('#2f86c8')], [0.7, hex('#6cd0e0')], [0.84, hex('#c4f2f6')], [1, hex('#f4ffff')],
  ];
  const STAR_COLORS = ['#ffffff', '#ffffff', '#dfe9ff', '#b9d0ff', '#fff1c2', '#ffd49a'].map(hex);
  const BAYER_4X4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  const mulberry32 = (seed) => {
    let state = seed >>> 0;
    return () => {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const hash2 = (ix, iy, seed) => {
    let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(seed | 0, 1103515245);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
  const valueNoise = (x, y, seed) => {
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = x - ix;
    const fy = y - iy;
    const sx = fx * fx * (3 - 2 * fx);
    const sy = fy * fy * (3 - 2 * fy);
    const top = hash2(ix, iy, seed) * (1 - sx) + hash2(ix + 1, iy, seed) * sx;
    const bottom = hash2(ix, iy + 1, seed) * (1 - sx) + hash2(ix + 1, iy + 1, seed) * sx;
    return top * (1 - sy) + bottom * sy;
  };
  const fbm = (x, y, seed, octaves) => {
    let sum = 0;
    let amplitude = 0.5;
    let frequency = 1;
    let norm = 0;
    for (let octave = 0; octave < octaves; octave += 1) {
      sum += valueNoise(x * frequency, y * frequency, seed + octave * 101) * amplitude;
      norm += amplitude;
      amplitude *= 0.5;
      frequency *= 2;
    }
    return sum / norm;
  };
  const clamp01 = (value) => Math.min(1, Math.max(0, value));
  const smoothstep = (edge0, edge1, value) => {
    const t = clamp01((value - edge0) / (edge1 - edge0));
    return t * t * (3 - 2 * t);
  };
  const sampleRamp = (ramp, t) => {
    for (let i = 1; i < ramp.length; i += 1) {
      const [stop, color] = ramp[i];
      if (t <= stop) {
        const [prevStop, prevColor] = ramp[i - 1];
        const k = (t - prevStop) / (stop - prevStop);
        return [
          prevColor[0] + (color[0] - prevColor[0]) * k,
          prevColor[1] + (color[1] - prevColor[1]) * k,
          prevColor[2] + (color[2] - prevColor[2]) * k,
        ];
      }
    }
    return ramp[ramp.length - 1][1];
  };
  const bayer = (x, y) => (BAYER_4X4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;

  const generatePixelGalaxy = (width, height, seed) => {
    const rng = mulberry32(seed);
    const noiseSeed = Math.floor(rng() * 1e9);
    const diagonal = Math.hypot(width, height);

    const slopeSign = rng() < 0.5 ? -1 : 1;
    const angle = slopeSign * (0.25 + rng() * 0.45);
    const axisX = Math.cos(angle);
    const axisY = Math.sin(angle);
    const centerX = width * (0.38 + rng() * 0.24);
    const centerY = height * (0.38 + rng() * 0.24);
    const bulgeAlong = (rng() - 0.5) * 0.3;
    const bandWidth = 0.11 + rng() * 0.05;
    const laneOffset = (rng() - 0.5) * 0.03;

    const pixels = new Uint8ClampedArray(width * height * 4);
    const bandBoost = new Float32Array(width * height);

    for (let y = 0; y < height; y += 1) {
      for (let x = 0; x < width; x += 1) {
        const u = x / diagonal;
        const v = y / diagonal;
        const dx = x - centerX;
        const dy = y - centerY;
        const along = (dx * axisX + dy * axisY) / diagonal;
        const across = (-dx * axisY + dy * axisX) / diagonal;

        const warped = across + (fbm(u * 3.2, v * 3.2, noiseSeed, 4) - 0.5) * 0.24;
        const taper = 0.5 + 0.5 * Math.exp(-((along / 0.5) ** 2));
        const half = bandWidth * taper;
        const band = Math.exp(-((warped / half) ** 2) * 1.2);
        const bulge = Math.exp(-(((along - bulgeAlong) ** 2) / 0.045 + (warped ** 2) / 0.006));
        const clouds = fbm(u * 11, v * 11, noiseSeed + 7, 5);
        const dustNoise = fbm(u * 15, v * 15, noiseSeed + 13, 4);
        const lane = Math.exp(-(((warped - laneOffset) / (half * 0.3)) ** 2));
        const dust = lane * smoothstep(0.4, 0.68, dustNoise);
        const halo = Math.exp(-((warped / (half * 2.8)) ** 2)) * 0.2;

        let intensity = band * (0.28 + 0.8 * clouds) + bulge * 0.6;
        intensity *= 1 - 0.88 * dust;
        intensity += halo * (0.5 + clouds * 0.5);
        // Capped below the ramp's near-white top so the core glows warm and
        // the text stays readable on top of it.
        intensity = clamp01(intensity) * MAX_INTENSITY;
        bandBoost[y * width + x] = clamp01(band + bulge);

        const hueNoise = fbm(u * 5 + 40, v * 5 + 40, noiseSeed + 29, 3);
        const coolness = smoothstep(0.38, 0.7, hueNoise * (1 - bulge * 0.85));

        const dither = bayer(x, y);
        const level = Math.floor(intensity * INTENSITY_LEVELS + dither) / INTENSITY_LEVELS;
        const hueLevel = Math.floor(coolness * HUE_LEVELS + dither) / HUE_LEVELS;
        const warm = sampleRamp(WARM_RAMP, clamp01(level));
        const cool = sampleRamp(COOL_RAMP, clamp01(level));

        const offset = (y * width + x) * 4;
        pixels[offset] = warm[0] + (cool[0] - warm[0]) * hueLevel;
        pixels[offset + 1] = warm[1] + (cool[1] - warm[1]) * hueLevel;
        pixels[offset + 2] = warm[2] + (cool[2] - warm[2]) * hueLevel;
        pixels[offset + 3] = 255;
      }
    }

    const twinklers = [];
    const paintStar = (x, y, color, strength) => {
      if (x < 0 || y < 0 || x >= width || y >= height) return;
      const offset = (y * width + x) * 4;
      pixels[offset] = Math.min(255, pixels[offset] + color[0] * strength);
      pixels[offset + 1] = Math.min(255, pixels[offset + 1] + color[1] * strength);
      pixels[offset + 2] = Math.min(255, pixels[offset + 2] + color[2] * strength);
    };

    const starCount = Math.round((width * height) / 85);
    for (let i = 0; i < starCount; i += 1) {
      const x = Math.floor(rng() * width);
      const y = Math.floor(rng() * height);
      // Stars crowd into the band, thin out in the void.
      if (rng() > 0.28 + 0.72 * bandBoost[y * width + x]) continue;

      const brightness = rng() ** 3;
      const color = STAR_COLORS[Math.floor(rng() * STAR_COLORS.length)];
      const sparkle = brightness > 0.9 && rng() < 0.5;

      if (brightness > 0.5 || sparkle) {
        twinklers.push({ x, y, color, phase: rng() * Math.PI * 2, period: 1.6 + rng() * 3.4 });
        if (sparkle) {
          paintStar(x - 1, y, color, 0.35);
          paintStar(x + 1, y, color, 0.35);
          paintStar(x, y - 1, color, 0.35);
          paintStar(x, y + 1, color, 0.35);
        }
        continue;
      }
      paintStar(x, y, color, 0.28 + brightness * 1.1);
    }

    return { width, height, pixels, twinklers };
  };

  // A new seed per visit, so every arrival gets its own sky.
  const seed = Math.floor(Math.random() * 0xffffffff);
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reducedMotion = motionQuery.matches;
  let galaxy = null;
  let base = null;
  let builtFor = '';
  let frameHandle = 0;
  let resizeTimer = 0;
  let lastFrameAt = 0;
  let shooter = null;
  let nextShooterAt = performance.now() / 1000 + 2.5;

  const build = () => {
    // A hidden or not-yet-laid-out window reports 0x0; the resize handler
    // builds the sky once it has a size.
    const viewportWidth = document.documentElement.clientWidth;
    const viewportHeight = document.documentElement.clientHeight;
    if (viewportWidth < 1 || viewportHeight < 1) return;
    const pixelSize = Math.max(MIN_PIXEL_SIZE, Math.ceil(Math.max(viewportWidth, viewportHeight) / MAX_GALAXY_WIDTH));
    const width = Math.ceil(viewportWidth / pixelSize);
    const height = Math.ceil(viewportHeight / pixelSize);
    galaxy = generatePixelGalaxy(width, height, seed);

    base = document.createElement('canvas');
    base.width = width;
    base.height = height;
    const baseContext = base.getContext('2d');
    if (!baseContext) return;
    const image = baseContext.createImageData(width, height);
    image.data.set(galaxy.pixels);
    baseContext.putImageData(image, 0, 0);

    canvas.width = width;
    canvas.height = height;
    canvas.style.width = `${width * pixelSize}px`;
    canvas.style.height = `${height * pixelSize}px`;
    builtFor = `${viewportWidth}x${viewportHeight}`;
  };

  const drawShootingStar = (seconds, width, height) => {
    if (!shooter && seconds >= nextShooterAt) {
      const direction = Math.random() < 0.5 ? -1 : 1;
      shooter = {
        x: width * (0.1 + Math.random() * 0.8),
        y: height * Math.random() * 0.4,
        vx: direction * (55 + Math.random() * 30),
        vy: 25 + Math.random() * 20,
        bornAt: seconds,
      };
    }
    if (!shooter) return;

    const age = seconds - shooter.bornAt;
    if (age > SHOOTING_STAR_LIFE_S) {
      shooter = null;
      nextShooterAt = seconds + 6 + Math.random() * 9;
      return;
    }
    for (let i = 0; i < SHOOTING_STAR_TRAIL; i += 1) {
      const trailAge = age - i * 0.035;
      if (trailAge < 0) continue;
      const alpha = (1 - i / SHOOTING_STAR_TRAIL) * (1 - age / SHOOTING_STAR_LIFE_S);
      context.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
      context.fillRect(Math.round(shooter.x + shooter.vx * trailAge), Math.round(shooter.y + shooter.vy * trailAge), 1, 1);
    }
  };

  const draw = (now) => {
    if (!galaxy || !base) return;
    context.drawImage(base, 0, 0);

    const seconds = now / 1000;
    for (const star of galaxy.twinklers) {
      const wave = 0.5 + 0.5 * Math.sin((seconds / star.period) * Math.PI * 2 + star.phase);
      // Stepped brightness keeps the twinkle pixel-y instead of a smooth fade.
      const alpha = reducedMotion ? 0.85 : Math.round((0.15 + 0.85 * wave * wave) * 5) / 5;
      context.fillStyle = `rgba(${star.color[0]},${star.color[1]},${star.color[2]},${alpha})`;
      context.fillRect(star.x, star.y, 1, 1);
    }

    if (!reducedMotion) drawShootingStar(seconds, galaxy.width, galaxy.height);
  };

  // About 11 frames per second, for a stop-motion feel.
  const tick = (now) => {
    frameHandle = window.requestAnimationFrame(tick);
    if (now - lastFrameAt < FRAME_INTERVAL_MS) return;
    lastFrameAt = now;
    draw(now);
  };

  const start = () => {
    window.cancelAnimationFrame(frameHandle);
    draw(performance.now());
    if (!reducedMotion) frameHandle = window.requestAnimationFrame(tick);
  };

  // Rebuild whenever the viewport's size is not the one the sky was painted
  // for. The observer also covers a page that loaded at 0x0 and was given a
  // size later without a window resize event.
  const scheduleRebuild = () => {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
      const root = document.documentElement;
      if (`${root.clientWidth}x${root.clientHeight}` === builtFor) return;
      build();
      draw(performance.now());
    }, RESIZE_DEBOUNCE_MS);
  };
  window.addEventListener('resize', scheduleRebuild);
  if ('ResizeObserver' in window) new ResizeObserver(scheduleRebuild).observe(document.documentElement);
  motionQuery.addEventListener('change', (event) => {
    reducedMotion = event.matches;
    start();
  });

  build();
  start();
})();
</script>
</body>
</html>
